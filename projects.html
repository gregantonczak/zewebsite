<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
  <title>Photography Portfolio</title>
</head>

<body class="font-sans text-white mx-4 bg-black">
    <!-- Back to home -->
    <a href="index.html" aria-label="Return to main page" class="group fixed top-4 left-4 z-50 flex items-center justify-center w-11 h-11 rounded-full bg-neutral-900/80 text-white hover:bg-neutral-700 shadow-md transition">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg><span class="pointer-events-none absolute left-full top-1/2 -translate-y-1/2 ml-3 whitespace-nowrap rounded-lg bg-neutral-900 px-3 py-1.5 text-sm font-semibold text-white shadow-md opacity-0 -translate-x-1 transition group-hover:opacity-100 group-hover:translate-x-0 group-focus-visible:opacity-100 group-focus-visible:translate-x-0">Return to main page</span>
    </a>

    <!-- Header -->
    <header class="text-center pt-12 pb-6">
      <h1 class="text-5xl font-bold text-white">Photography Portfolio</h1>
    </header>

    <!-- Slideshow Container -->
    <section class="max-w-4xl mx-auto relative">
        <div class="flex items-center gap-3 sm:gap-4">
            <!-- Previous Button -->
            <button onclick="changeSlide(-1)" aria-label="Previous photo" class="shrink-0 flex items-center justify-center w-11 h-11 rounded-full bg-neutral-900/80 hover:bg-neutral-700 text-white shadow-md transition">
                <ion-icon name="chevron-back-outline"></ion-icon>
            </button>

            <!-- Image Box -->
            <div class="relative flex-1 min-w-0 overflow-hidden rounded-xl bg-neutral-900/50 shadow-lg">
                <div class="slides flex transition-transform duration-700 ease-in-out">
                    <!-- Add photos here, e.g. <img src="photo1.jpg" alt="Photo 1" class="w-full hidden"> -->
                </div>

                <!-- Placeholder shown until projects are uploaded -->
                <div id="pending-projects" class="aspect-[8/5] flex items-center justify-center p-6 text-center">
                    <p class="text-2xl font-bold text-gray-500">pending uploaded projects</p>
                </div>
            </div>

            <!-- Next Button -->
            <button onclick="changeSlide(1)" aria-label="Next photo" class="shrink-0 flex items-center justify-center w-11 h-11 rounded-full bg-neutral-900/80 hover:bg-neutral-700 text-white shadow-md transition">
                <ion-icon name="chevron-forward-outline"></ion-icon>
            </button>
        </div>

        <!-- Social Media Share Button -->
        <div class="text-center mt-6">
            <button class="inline-flex items-center gap-2 px-5 py-2 rounded-lg bg-white text-black font-bold hover:bg-gray-200 transition">
                <ion-icon name="share-social-outline"></ion-icon> Share Portfolio
            </button>
        </div>
    </section>

    <script>
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slides img');

        function showSlide(index) {
            slides.forEach((slide, i) => {
                slide.classList.toggle('hidden', i !== index);
            });
        }
        
        function changeSlide(direction) {
            if (slides.length === 0) return;
            currentSlide = (currentSlide + direction + slides.length) % slides.length;
            showSlide(currentSlide);
        }

        // Hide the placeholder once there are photos to show
        if (slides.length > 0) {
            document.getElementById('pending-projects').classList.add('hidden');
        }

        showSlide(currentSlide);
    </script>
</body>
</html>
