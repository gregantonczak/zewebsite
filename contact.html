<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
  <title>
    contact!
  </title>
</head>

<body class="h-14 font-sans bg-black mx-4">
  <!-- Back to home -->
  <a href="index.html" aria-label="Return to main page" class="group fixed top-4 left-4 z-50 flex items-center justify-center w-11 h-11 rounded-full bg-neutral-900/80 text-white hover:bg-neutral-700 shadow-md transition">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg><span class="pointer-events-none absolute left-full top-1/2 -translate-y-1/2 ml-3 whitespace-nowrap rounded-lg bg-neutral-900 px-3 py-1.5 text-sm font-semibold text-white shadow-md opacity-0 -translate-x-1 transition group-hover:opacity-100 group-hover:translate-x-0 group-focus-visible:opacity-100 group-focus-visible:translate-x-0">Return to main page</span>
  </a>

  <!-- Header -->
  <header class="text-center pt-12 pb-3 mx-10 text">
    <h1 class="text-5xl my-5 text-white font-bold">
      🖂!
    </h1>
  </header>
</body>

<div class="bckgrnd dark:bg-black">
  <div class="py-8 lg:py-16 px-4 mx-auto max-w-screen-md">
      <form action="#" class="space-y-8">
        <div>
            <label for="email" class="block mb-2 text-sm font-bold text-gray-900 dark:text-gray-300">
              Your email
            </label>
            <input type="email" id="email" class="shadow-sm bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5 dark:bg-gray-700/50 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500 dark:shadow-sm-light" placeholder="🖂" required>
        </div>
        <div>
            <label for="subject" class="block mb-2 text-sm font-bold text-gray-900 dark:text-gray-300">
              Subject
            </label>
            <input type="text" id="subject" class="block p-3 w-full text-sm text-gray-900 bg-gray-50 rounded-lg border border-gray-300 shadow-sm focus:ring-primary-500 focus:border-primary-500 dark:bg-gray-700/50 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500 dark:shadow-sm-light" placeholder="⁇" required>
        </div>
        <div class="sm:col-span-2">
            <label for="message" class="block mb-2 text-sm font-bold text-gray-900 dark:text-gray-300">
              Your message
            </label>
            <textarea id="message" rows="6" class="block p-2.5 w-full text-sm text-gray-900 bg-gray-50 rounded-lg shadow-sm border border-gray-300 focus:ring-primary-500 focus:border-primary-500 dark:bg-gray-700/50 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500" placeholder="🖉"></textarea>
        </div>
        <button type="submit" class="py-3 px-5 text-sm font-medium text-center text-white rounded-lg bg-primary-700 sm:w-fit hover:bg-primary-800 hover:font-bold focus:ring-4 focus:outline-none focus:ring-primary-300 dark:bg-primary-600 dark:hover:bg-primary-700 dark:focus:ring-primary-800">
          Send message</button>
      </form>
      
  </div>
</div>
